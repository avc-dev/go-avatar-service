{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophprofile.fullname" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ include "gophprofile.postgresDSN" . | quote }}
  MINIO_ACCESS_KEY: {{ include "gophprofile.minioAccessKey" . | quote }}
  MINIO_SECRET_KEY: {{ include "gophprofile.minioSecretKey" . | quote }}
  RABBITMQ_URL: {{ include "gophprofile.rabbitmqURL" . | quote }}
{{- end }}
