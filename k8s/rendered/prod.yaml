apiVersion: apps/v1
kind: Deployment
metadata:
  name: gophprofile-worker
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/instance: gophprofile
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        helm.sh/chart: gophprofile-0.1.0
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/instance: gophprofile
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: gophprofile
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Same migration gate as the server: both pods run it, golang-migrate's
      # advisory lock makes the concurrent run safe.
      initContainers:
        - name: copy-migrations
          image: "gophprofile-app:0.1.0"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -r /app/migrations/* /migrations/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
        - name: migrate
          image: "migrate/migrate:v4.18.3"
          imagePullPolicy: IfNotPresent
          args: ["-path=/migrations", "-database=$(POSTGRES_DSN)", "up"]
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: gophprofile-secrets
                  key: POSTGRES_DSN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          emptyDir: {}
      containers:
        - name: worker
          image: "gophprofile-app:0.1.0"
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: gophprofile
            - secretRef:
                name: gophprofile-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
