# Source: gophprofile/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  HTTP_PORT: "8080"
  SERVER_ADMIN_PORT: "8081"
  WORKER_ADMIN_PORT: "8081"
  # int64 first: a bare large number renders in scientific notation (1.04e+07),
  # which strconv.ParseInt rejects. Force a plain integer string.
  HTTP_MAX_UPLOAD_BYTES: "10485760"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  MINIO_ENDPOINT: "minio.data.svc.cluster.local:9000"
  MINIO_BUCKET: "avatars"
  MINIO_USE_SSL: "false"
  RABBITMQ_EXCHANGE: "avatars.exchange"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"
  OTEL_ENVIRONMENT: "prod"
  OTEL_TRACES_SAMPLER_RATIO: "0.1"
  CORS_ALLOWED_ORIGINS: ""
  RATE_LIMIT_READ_PER_MIN: "100"
  RATE_LIMIT_WRITE_PER_MIN: "10"
  BREAKER_MAX_REQUESTS: "3"
  BREAKER_INTERVAL: "30s"
  BREAKER_TIMEOUT: "15s"
  BREAKER_MIN_REQUESTS: "5"
  BREAKER_FAILURE_RATIO: "0.6"
