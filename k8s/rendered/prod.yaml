  tls:
    - hosts:
      - avatars.example.com
      secretName: avatars-tls
  rules:
    - host: "avatars.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gophprofile-server
                port:
                  name: http
