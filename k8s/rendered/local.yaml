# Source: gophprofile/templates/migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: gophprofile-migrate
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/instance: gophprofile
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: gophprofile
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: migrations
          emptyDir: {}
      # Copy the SQL out of the app image so migrate/migrate has one source of truth.
      initContainers:
        - name: copy-migrations
          image: "gophprofile-app:local"
          imagePullPolicy: Never
          command: ["sh", "-c", "cp -r /app/migrations/* /migrations/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      containers:
        - name: migrate
          image: "migrate/migrate:v4.18.3"
          # Its own pull policy: migrate/migrate is an upstream image, so it must
          # be pullable even when the app image is pinned to Never (side-loaded).
          imagePullPolicy: IfNotPresent
          args:
            - "-path=/migrations"
            - "-database=$(POSTGRES_DSN)"
            - "up"
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: gophprofile
                  key: POSTGRES_DSN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: migrations
              mountPath: /migrations

