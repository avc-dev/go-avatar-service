# Shared block for the two application services: same image, same env. Each
# service overrides command/container_name/ports/healthcheck below. Map merging
# of YAML anchors is well-supported by modern docker compose.
x-app-base: &app-base
  image: gophprofile-app:local
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrator:
      condition: service_completed_successfully
    jaeger:
      condition: service_started
  environment:
    # Inside compose, app talks to deps via service names and CONTAINER ports
    # (not the host-side 5433/5673 mapping we use for `make run-server`).
    POSTGRES_DSN: postgres://avatars:avatars@postgres:5432/avatars?sslmode=disable
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET: avatars
    MINIO_USE_SSL: "false"
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    RABBITMQ_EXCHANGE: avatars.exchange
    HTTP_PORT: "8080"
    LOG_LEVEL: info
    LOG_FORMAT: json
    # Security knobs — see internal/config/config.go for semantics.
    CORS_ALLOWED_ORIGINS: ""
    RATE_LIMIT_READ_PER_MIN: "100"
    RATE_LIMIT_WRITE_PER_MIN: "10"
    # Tracing: export OTLP/gRPC straight to Jaeger's native OTLP receiver.
    OTEL_ENABLED: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    OTEL_ENVIRONMENT: compose
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: gophprofile-postgres
    environment:
      POSTGRES_USER: avatars
      POSTGRES_PASSWORD: avatars
      POSTGRES_DB: avatars
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatars -d avatars"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: gophprofile-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gophprofile-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Enable the built-in Prometheus exporter (port 15692) alongside the
      # management plugin, so Prometheus can scrape queue depth and broker stats.
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot service: applies all pending migrations, then exits. The app
  # services depend on its successful completion before starting. Keeping
  # migrations as a separate one-shot (rather than baking them into server
  # startup) makes the deploy story safer once multiple replicas show up.
  migrator:
    image: migrate/migrate:v4.18.3
    container_name: gophprofile-migrator
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://avatars:avatars@postgres:5432/avatars?sslmode=disable"
      - "up"
    restart: "no"

  app-server:
    <<: *app-base
    container_name: gophprofile-app-server
    # Uses Dockerfile's CMD (/usr/local/bin/server) — no override needed.
    ports:
      - "8080:8080"
    healthcheck:
      # busybox wget --spider returns non-zero on non-2xx responses; perfect
      # for our /health which is 200 (all green) or 503 (degraded).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app-worker:
    <<: *app-base
    container_name: gophprofile-app-worker
    # The worker exposes an admin HTTP server (WORKER_ADMIN_PORT=8081) for
    # /health and /metrics. No host mapping needed — Prometheus scrapes it by
    # service name inside the compose network (app-worker:8081).
    command: ["/usr/local/bin/worker"]

  # --- Observability stack ---

  # Distributed tracing backend + UI. The app exports OTLP/gRPC straight here
  # (Jaeger's native OTLP receiver, no separate collector). An optional OTel
  # Collector config is kept at docker/otel-collector-config.yaml if a
  # collector hop is ever wanted in front of Jaeger.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: gophprofile-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC (also lets a host-run app export to localhost:4317)
    restart: unless-stopped

  # Metrics store + scraper. Scrapes app-server, app-worker and rabbitmq;
  # evaluates alert rules and forwards firing alerts to Alertmanager.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gophprofile-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      alertmanager:
        condition: service_started
    restart: unless-stopped

  # Routes/deduplicates firing alerts. UI on 9093; the default receiver has no
  # external notifier (see docker/alertmanager/alertmanager.yml).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: gophprofile-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  # Log aggregation backend for the JSON logs Alloy ships from container stdout.
  loki:
    image: grafana/loki:3.3.0
    container_name: gophprofile-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  # Tails Docker container logs and pushes them to Loki. Needs the Docker socket
  # to discover containers and read their log streams.
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: gophprofile-alloy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345" # Alloy UI
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  # Visualisation: provisioned datasources (Prometheus/Loki/Jaeger) + dashboards.
  # Anonymous admin access — convenient for a local learning stack.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: gophprofile-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
