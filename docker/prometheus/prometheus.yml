# Prometheus scrape + rules config. Targets are addressed by compose service
# name on their CONTAINER ports (not the host-side mappings).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules live alongside this file.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: avatar-server
    static_configs:
      # /metrics is exposed on the server's admin port (SERVER_ADMIN_PORT=8081),
      # not the public 8080.
      - targets: ["app-server:8081"]
        labels:
          service: gophprofile-server

  - job_name: avatar-worker
    static_configs:
      - targets: ["app-worker:8081"]
        labels:
          service: gophprofile-worker

  # RabbitMQ's built-in rabbitmq_prometheus plugin (queue depth, connections...).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
